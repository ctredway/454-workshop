# Builds 454 Workshop for Windows on GitHub's own Windows machines.
#   - Run it by hand: Actions tab > "windows build" > Run workflow. The installer and zip are attached
#     to the run as an artifact to download.
#   - Change the version in apps/desktop/package.json and push: the version is tagged (v0.6.3), built, and
#     drafted as a release with the installer, zip and update files, for you to review and publish. A
#     version with a suffix (0.6.3-beta.1) is a pre-release, offered only on the Beta update channel.
#   - Pushing a version tag by hand (v0.6.3) does the same, as before.
# Built from the repository's own index.html, design.html and docs/. CAM is included only if cam.js and
# geom.js are in the repository, which they aren't until CAM is released.
name: windows build

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    # a new version in the desktop app's package.json tags itself and builds: no separate tag step
    branches: [main]
    paths: ['apps/desktop/package.json']

permissions:
  contents: write          # to create the tag, and the draft release

jobs:
  # Which release this run makes, if any. A pushed tag: that one. A package.json change on main: its version,
  # unless that version already has a tag (released) or a draft (waiting to be published): then nothing is
  # built. By hand (Run workflow): a build to download from the run, with no release.
  #
  # The tag isn't created here. The draft release records this commit, and GitHub creates the tag when the
  # draft is published: installed copies find updates through GitHub's release feed, which lists every tag,
  # so a tag made before its release is published looks to them like a newest release with nothing in it.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}            # to see drafts, which only the repository can
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"; echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then echo "tag=" >> "$GITHUB_OUTPUT"; echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          tag="v$(node -p "require('./apps/desktop/package.json').version")"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "::notice::$tag is already released (its tag exists), so the version didn't change: nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::A draft of $tag is already waiting on the Releases page: publish it (or delete it, then push again to rebuild)."
            echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "::notice::Building $tag and drafting its release. Its tag is created when you publish the draft."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"; echo "build=true" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            docs-site/package-lock.json

      - name: Install
        run: npm ci

      - name: Check the apps' sources
        # index.html must be 454 Control, matching apps/control/src; the website's files don't belong here
        shell: bash
        run: |
          cd ../..
          node apps/control/build.mjs --check || { echo "::error::index.html isn't the current 454 Control. If the website zip was unzipped into the repository, see DEVELOPING.md; the website zip goes to Cloudflare only."; exit 1; }
          node apps/design/build.mjs --check || { echo "::error::design.html isn't the current 454 Design: it must match apps/design/src."; exit 1; }
          for d in control design; do [ ! -e "$d/index.html" ] || echo "::warning::$d/ holds a website copy of an app; it doesn't belong in the repository (and isn't used)."; done

      - name: Install the docs site (bundled into the app)
        run: npm ci --prefix ../../docs-site

      - name: Assemble the app's pages
        run: npm run build:app

      - name: Check the tag matches the app's version (version tags only)
        if: needs.version.outputs.tag != ''
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          app=$(node -p "require('./package.json').version")
          tag="${TAG#v}"
          if [ "$app" != "$tag" ]; then
            echo "::error::The tag is v$tag but apps/desktop/package.json says $app. Automatic updates compare that version, so a release made this way would never be offered. Set the version to $tag, commit, and tag again."
            exit 1
          fi

      - name: Build the installer and zip
        run: npx electron-builder --win nsis zip --x64 --publish never

      - name: Check the update files were made
        # installed copies find a release through latest.yml (which names the installer and its checksum)
        shell: bash
        run: |
          # a pre-release (0.6.1-beta.1) may be described by beta.yml rather than latest.yml; the app asks
          # for the channel's file first, then latest.yml, so either will do
          files=$(ls dist/latest.yml dist/beta.yml dist/alpha.yml 2>/dev/null || true)
          [ -n "$files" ] || { echo "::error::No update file (latest.yml, beta.yml or alpha.yml) in dist/: installed copies couldn't find this build as an update."; ls dist; exit 1; }
          exe=$(basename "$(ls dist/*.exe | head -1)")
          for f in $files; do grep -q "$exe" "$f" || { echo "::error::$f doesn't name the installer ($exe)."; exit 1; }; done
          ls dist/*.exe.blockmap > /dev/null || { echo "::error::the installer's blockmap is missing."; exit 1; }
          for f in $files; do echo "Update file OK: $f"; cat "$f"; done

      - name: Attach to this run
        uses: actions/upload-artifact@v4
        with:
          name: 454-Workshop-windows
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.zip
            apps/desktop/dist/latest.yml
            apps/desktop/dist/beta.yml
            apps/desktop/dist/alpha.yml
            apps/desktop/dist/*.blockmap
          if-no-files-found: error

      - name: Draft a release (version tags only)
        if: needs.version.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          # a tag with a suffix (v0.6.0-beta.1) is a pre-release: only the Beta update channel offers it
          tag_name: ${{ needs.version.outputs.tag }}
          # the commit this build is from: the tag is made there when the draft is published
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(needs.version.outputs.tag, '-') }}
          # latest.yml and the blockmap are how installed copies find and download updates
          files: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.zip
            apps/desktop/dist/latest.yml
            apps/desktop/dist/beta.yml
            apps/desktop/dist/alpha.yml
            apps/desktop/dist/*.blockmap
