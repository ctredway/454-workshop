# Builds 454 Workshop for Windows on GitHub's own Windows machines.
#   - Run it by hand: Actions tab > "windows build" > Run workflow. The installer and zip are attached
#     to the run as an artifact to download.
#   - Push a version tag (e.g. v0.5.0): the same build, plus a draft release on the Releases page with
#     the installer and zip attached, for you to review and publish.
# Built from the repository's own index.html, design.html and docs/. CAM is included only if cam.js and
# geom.js are in the repository, which they aren't until CAM is released.
name: windows build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write          # to create the draft release on a tag

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            docs-site/package-lock.json

      - name: Install
        run: npm ci

      - name: Install the docs site (bundled into the app)
        run: npm ci --prefix ../../docs-site

      - name: Assemble the app's pages
        run: npm run build:app

      - name: Check the tag matches the app's version (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          app=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$app" != "$tag" ]; then
            echo "::error::The tag is v$tag but apps/desktop/package.json says $app. Automatic updates compare that version, so a release made this way would never be offered. Set the version to $tag, commit, and tag again."
            exit 1
          fi

      - name: Build the installer and zip
        run: npx electron-builder --win nsis zip --x64 --publish never

      - name: Check the update files were made
        # installed copies find a release through latest.yml (which names the installer and its checksum)
        shell: bash
        run: |
          test -f dist/latest.yml || { echo "::error::dist/latest.yml is missing: installed copies couldn't find this build as an update."; exit 1; }
          exe=$(basename "$(ls dist/*.exe | head -1)")
          grep -q "$exe" dist/latest.yml || { echo "::error::dist/latest.yml doesn't name the installer ($exe)."; exit 1; }
          ls dist/*.exe.blockmap > /dev/null || { echo "::error::the installer's blockmap is missing."; exit 1; }
          echo "Update files OK:"; cat dist/latest.yml

      - name: Attach to this run
        uses: actions/upload-artifact@v4
        with:
          name: 454-Workshop-windows
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.zip
            apps/desktop/dist/latest.yml
            apps/desktop/dist/*.blockmap
          if-no-files-found: error

      - name: Draft a release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          # a tag with a suffix (v0.6.0-beta.1) is a pre-release: only the Beta update channel offers it
          prerelease: ${{ contains(github.ref_name, '-') }}
          # latest.yml and the blockmap are how installed copies find and download updates
          files: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.zip
            apps/desktop/dist/latest.yml
            apps/desktop/dist/*.blockmap
