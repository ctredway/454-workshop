name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: 454 Control's index.html matches its source files (apps/control/src)
        run: node apps/control/build.mjs --check
      - name: 454 Control's unit tests (the job builder)
        run: node --test 'apps/control/test/*.test.mjs'
      - run: npm ci
      - run: npm run build
      - run: npm test
